<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{{ APP_NAME }}{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='icons/favicon.svg') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="bg-orb orb-1"></div>

        <path d="M9.25 12.15L11.15 14.05L15.1 10.1" />
      </svg>
    </div>

    <div class="footer-info">
      <strong>J&amp;T Express Brazil LTDA</strong>
      <span>CNPJ: 42.584.754/0001-86</span>
      <span>Developed by: Eduardo Rodrigues</span>
    </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>

</html>
